[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career"
version = "0.1.0"
description = "Retrieve Tennis Abstract career matches and plot age differences"
requires-python = ">=3.10"
dependencies = ["pandas>=1.5", "matplotlib>=3.6"]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
